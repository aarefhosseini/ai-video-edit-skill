name: Media pipeline
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .agents/skills/video-edit/scripts/requirements.txt
      - run: python -m pip install -r .agents/skills/video-edit/scripts/requirements.txt
      - run: python .agents/skills/video-edit/scripts/media.py doctor
      - run: python -m unittest discover -s tests -v
